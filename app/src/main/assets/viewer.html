<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <style>
        /* A4 GÖRÜNÜŞÜ */
        body { background-color: #E0E0E0; padding: 15px 5px; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .docx-wrapper { background: transparent !important; padding: 0 !important; }
        
        /* A4 KAĞIZ EFFEKTİ */
        .docx, .paper { 
            background: white; 
            max-width: 800px; 
            margin: 0 auto 20px auto; 
            padding: 40px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            border-radius: 4px; 
            color: #333;
        }
        
        .docx { box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important; }
        
        table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 10px; }
        th, td { border: 1px solid #E2E8F0; padding: 10px; text-align: left; }
        th { background: #F1F5F9; font-weight: bold; color: #1E293B; }
        tr:nth-child(even) { background: #F8FAFC; }
        
        .slide-title { color: #1E1B4B; font-size: 22px; font-weight: 600; margin-bottom: 20px; border-bottom: 2px solid #F1F5F9; padding-bottom: 10px;}
        .slide-content p { font-size: 16px; color: #334155; line-height: 1.6; margin-bottom: 10px; }

        /* SAĞDAKİ SÜRÜŞDÜRMƏ ÇUBUĞU */
        #scrollIndicator { position: fixed; right: 2px; top: 10%; height: 80%; width: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; z-index: 1000; }
        #scrollThumb { position: absolute; width: 100%; background: #1E1B4B; border-radius: 3px; top: 0; height: 10%; transition: top 0.1s ease; }
        
        /* SƏHİFƏ GÖSTƏRİCİSİ */
        #pageInfo { position: fixed; right: 16px; bottom: 16px; background: rgba(30,27,75,0.9); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 1000; }
        #loading { text-align: center; margin-top: 50px; font-size: 18px; color: #1E1B4B; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loading">Sənəd Yüklənir...</div>
    <div id="container"></div>
    <div id="scrollIndicator"><div id="scrollThumb"></div></div>
    <div id="pageInfo">Səhifə: 1 / 1</div>

    <script>
        window.onscroll = function() {
            var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrollPercent = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            
            var thumb = document.getElementById("scrollThumb");
            thumb.style.top = scrollPercent + "%";
            thumb.style.height = Math.max(10, 100 - scrollPercent) + "%";
            
            var totalPages = document.querySelectorAll('.docx, .slide, .paper').length || 1;
            var currentPage = Math.ceil((scrollPercent / 100) * totalPages) || 1;
            if(currentPage > totalPages) currentPage = totalPages;
            if(currentPage < 1) currentPage = 1;
            
            document.getElementById("pageInfo").innerText = "Səhifə: " + currentPage + " / " + totalPages;
        };

        function renderDocx(base64Data) {
            document.getElementById('loading').style.display = 'none';
            var binaryString = atob(base64Data);
            var len = binaryString.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
            docx.renderAsync(bytes.buffer, document.getElementById("container"), null, {
                className: "docx", inWrapper: true, ignoreWidth: false, ignoreHeight: false,
                ignoreFonts: false, breakPages: true, renderHeaders: true, renderFooters: true
            }).then(() => { window.onscroll(); });
        }

        function renderHtml(base64Html) {
            document.getElementById('loading').style.display = 'none';
            var html = atob(base64Html);
            document.getElementById("container").innerHTML = html;
            setTimeout(() => { window.onscroll(); }, 100);
        }
    </script>
</body>
</html>
