<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- YERLİ (OFFLINE) KİTABXANALAR -->
    <script src="jszip.min.js"></script>
    <script src="docx-preview.min.js"></script>
    <style>
        body { background-color: #f3f4f6; padding: 10px; font-family: sans-serif; margin: 0; }
        .docx-wrapper { background: transparent !important; padding: 0 !important; }
        .docx { box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; border-radius: 8px; margin-bottom: 20px !important; background: white; }
        #loading { text-align: center; margin-top: 50px; font-size: 18px; color: #1E1B4B; font-weight: bold; }
        
        /* SAĞ TƏRƏFDƏ ŞAQUİ SÜRÜŞDÜRMƏ ÇUBUĞU */
        #scrollIndicator {
            position: fixed; right: 5px; top: 10%; height: 80%; width: 6px;
            background: rgba(0,0,0,0.1); border-radius: 3px; z-index: 1000;
        }
        #scrollThumb {
            position: absolute; width: 100%; background: #1E1B4B; border-radius: 3px;
            top: 0; height: 20%;
        }
        /* SƏHİFƏ VƏ MİQYAS GÖSTƏRİCİSİ */
        #pageInfo {
            position: fixed; right: 15px; bottom: 20px; background: rgba(30,27,75,0.9);
            color: white; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">Sənəd Yüklənir...</div>
    <div id="container"></div>
    
    <!-- Sürüşdürmə çubuğu və səhifə məlumatı -->
    <div id="scrollIndicator"><div id="scrollThumb"></div></div>
    <div id="pageInfo">Səhifə: 1 / 1</div>

    <script>
        // Sürüşdürmə çubuğunu yeniləyən funksiya
        window.onscroll = function() {
            var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            var scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrollPercent = (scrollTop / scrollHeight) * 100;
            
            // Thumb-u hərəkət etdir
            var thumb = document.getElementById("scrollThumb");
            thumb.style.top = scrollPercent + "%";
            thumb.style.height = Math.max(10, 100 - scrollPercent) + "%";
            
            // Səhifə nömrəsini yenilə (təxmini)
            var totalPages = document.querySelectorAll('.docx').length || 1;
            var currentPage = Math.ceil((scrollPercent / 100) * totalPages) || 1;
            document.getElementById("pageInfo").innerText = "Səhifə: " + currentPage + " / " + totalPages;
        };

        function renderDocx(base64Data) {
            document.getElementById('loading').style.display = 'none';
            var binaryString = atob(base64Data);
            var len = binaryString.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            docx.renderAsync(bytes.buffer, document.getElementById("container"), null, {
                className: "docx", inWrapper: true, ignoreWidth: false, ignoreHeight: false,
                ignoreFonts: false, breakPages: true, renderHeaders: true, renderFooters: true
            }).then(() => {
                // Səhifə sayını yenilə
                var totalPages = document.querySelectorAll('.docx').length;
                document.getElementById("pageInfo").innerText = "Səhifə: 1 / " + totalPages;
            });
        }
    </script>
</body>
</html>
